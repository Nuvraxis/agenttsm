name: Release

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - ".changeset/**"

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  version:
    name: Version Packages PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has-changesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset version
          pr-title: Version Packages
          commit-message: Version Packages
          create-github-releases: false
          push-git-tags: false

  publish:
    name: Publish to npm
    needs: version
    if: needs.version.outputs.has-changesets == 'false'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org

      - name: Build the packages
        run: pnpm exec turbo run build --filter='./packages/*'

      - name: Publish new versions and create GitHub Releases
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for dir in packages/*/; do
            manifest="./${dir}package.json"
            if [ "$(node -p "Boolean(require('${manifest}').private)")" = "true" ]; then
              continue
            fi
            name="$(node -p "require('${manifest}').name")"
            version="$(node -p "require('${manifest}').version")"
            if npm view "${name}@${version}" version > /dev/null 2>&1; then
              echo "${name}@${version} is already published."
              continue
            fi

            # pnpm pack rewrites catalog: and workspace: specifiers to real versions.
            out="${RUNNER_TEMP}/pack/${dir}"
            mkdir -p "${out}"
            pnpm --filter "${name}" pack --pack-destination "${out}"
            npm publish "${out}"*.tgz --provenance --access public

            # The core package keeps its vX.Y.Z tags; the others are tagged <name>@X.Y.Z.
            if [ "${name}" = "@nuvraxis-org/agenttsm" ]; then
              tag="v${version}"
            else
              tag="${name}@${version}"
            fi
            awk -v heading="## ${version}" '$0 == heading { found = 1; next } found && /^## / { exit } found { print }' \
              "${dir}CHANGELOG.md" > "${out}notes.md"
            gh release create "${tag}" \
              --target "$GITHUB_SHA" \
              --title "${tag}" \
              --notes-file "${out}notes.md"
          done
